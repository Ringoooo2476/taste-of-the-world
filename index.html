<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taste of the World!</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
      background: #fffaf3;
      color: #222;
    }

    .card {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 40px 30px;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.10);
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    a.button {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 26px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    a.button:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>🌍 Taste of the World! 🍪🍿</h1>

  <p>
    Welcome! Upload your snack before the event and come back during
    Taste of the World to vote for your favorite snack. 😄
  </p>

  <p>
    <strong>Wednesday, September 9, 2026</strong><br>
    2:00–2:30 PM<br>
    STEM + Ag 3134
  </p>

  <a class="button"
     href="https://taste-of-the-world-eight.vercel.app/">
     Enter Taste of the World →
  </a>
</div>

</body>
</html>
